server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: motogp-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/motogp}
    username: ${DATABASE_USERNAME:motogp}
    password: ${DATABASE_PASSWORD:motogp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

motogp:
  internal-ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${INTERNAL_SERVICE_TOKEN:phase0-local-token}
