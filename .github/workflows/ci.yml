name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build frontend container
        working-directory: .
        run: docker build --file frontend/web/Dockerfile --tag motogp-intelligence-web:ci .

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required documentation
        run: |
          test -s docs/PROJECT_SPECIFICATION.md
          test -s docs/ARCHITECTURE.md
          test -s docs/DATABASE_DESIGN.md
          test -s docs/API_CONTRACTS.md
          test -s docs/DEVELOPMENT_PLAN.md
          test -s docs/IMPLEMENTATION_STATUS.md
          test -s docs/KNOWN_LIMITATIONS.md
